name: Build Unsigned IPA

on:
  workflow_dispatch:
    inputs:
      bundle_id:
        description: Bundle ID used before re-signing
        required: true
        default: com.leshko.freetube
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: unsigned-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-26
    timeout-minutes: 60
    env:
      PROJECT: FreeTube/FreeTube.xcodeproj
      SCHEME: FreeTube
      BUNDLE_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.bundle_id || 'com.leshko.freetube' }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Show build environment
        run: |
          set -euxo pipefail
          xcodebuild -version
          swift --version
          xcodebuild -project "$PROJECT" -list

      - name: Set main app bundle identifier
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path

          path = Path("FreeTube/FreeTube.xcodeproj/project.pbxproj")
          text = path.read_text()
          old = "PRODUCT_BUNDLE_IDENTIFIER = com.leshko.freetube;"
          new = f"PRODUCT_BUNDLE_IDENTIFIER = {os.environ['BUNDLE_ID']};"
          count = text.count(old)
          if count != 2:
              raise SystemExit(f"Expected 2 main-target Bundle ID settings, found {count}")
          path.write_text(text.replace(old, new))
          PY

      - name: Resolve Swift packages
        run: |
          set -euxo pipefail
          xcodebuild \
            -resolvePackageDependencies \
            -project "$PROJECT" \
            -scheme "$SCHEME"

      - name: Build device app without signing
        run: |
          set -euxo pipefail
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            ENABLE_DEBUG_DYLIB=NO \
            ENABLE_PREVIEWS=NO \
            ENABLE_TESTABILITY=NO \
            SWIFT_OPTIMIZATION_LEVEL=-O \
            DEBUG_INFORMATION_FORMAT=dwarf-with-dsym \
            clean build

      - name: Validate re-signable app bundle
        run: |
          set -euxo pipefail
          APP="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/FreeTube.app"
          test -d "$APP"
          test -f "$APP/FreeTube"
          test ! -e "$APP/FreeTube.debug.dylib"
          test ! -e "$APP/__preview.dylib"
          ! otool -L "$APP/FreeTube" | grep -E 'debug\.dylib|__preview\.dylib'

          APP_ID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")
          test "$APP_ID" = "$BUNDLE_ID"
          find "$APP" -mindepth 2 -name Info.plist -print0 | while IFS= read -r -d '' plist; do
            NESTED_ID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$plist" 2>/dev/null || true)
            if [[ -n "$NESTED_ID" && "$NESTED_ID" = "$APP_ID" ]]; then
              echo "Nested bundle reuses main app ID: $plist" >&2
              exit 1
            fi
          done

          # Report every nested Mach-O component that a signing tool must sign.
          find "$APP" -type f -print0 | while IFS= read -r -d '' file; do
            if file "$file" | grep -q 'Mach-O'; then
              echo "Mach-O: ${file#$APP/}"
            fi
          done

      - name: Package unsigned IPA
        id: package
        run: |
          set -euxo pipefail
          APP="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/FreeTube.app"
          test -d "$APP"

          rm -rf "$RUNNER_TEMP/Payload" "$GITHUB_WORKSPACE/dist"
          mkdir -p "$RUNNER_TEMP/Payload" "$GITHUB_WORKSPACE/dist"
          cp -R "$APP" "$RUNNER_TEMP/Payload/"
          xattr -cr "$RUNNER_TEMP/Payload"

          SHORT_SHA="${GITHUB_SHA::7}"
          IPA="$GITHUB_WORKSPACE/dist/FreeTube-unsigned-${SHORT_SHA}.ipa"
          cd "$RUNNER_TEMP"
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent Payload "$IPA"

          shasum -a 256 "$IPA" > "${IPA}.sha256"
          unzip -t "$IPA"
          echo "ipa=$IPA" >> "$GITHUB_OUTPUT"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: FreeTube-unsigned-${{ github.run_number }}
          path: |
            dist/*.ipa
            dist/*.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
